/* ==================================================================== */

const FPS = 30;
const DURATION = 27.0;                       // total length, seconds
const TAKE_FRAMES_DIR = 'media/frames/';     // extracted from media/silverroom-take.mp4 at 30 fps

// Act 1: composer

const DRIFT = [

  [['pl','']],

/* ==================================================================== */
/*  Easing helpers                                                       */
/* ==================================================================== */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);              // fast-out gentle-in
const easeInOut = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const prog = (t, [a, b], ease = easeOut) => ease(clamp01((t - a) / (b - a)));
const lerp = (a, b, p) => a + (b - a) * p;

/*  Static icons                                                        */
/* ==================================================================== */
const APPLE = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M16.37 12.68c.02 2.7 2.36 3.6 2.39 3.61-.02.06-.37 1.28-1.23 2.53-.74 1.08-1.51 2.16-2.72 2.18-1.19.02-1.58-.71-2.94-.71s-1.79.69-2.92.73c-1.17.04-2.06-1.17-2.81-2.25-1.53-2.21-2.7-6.24-1.13-8.96.78-1.35 2.17-2.2 3.69-2.23 1.15-.02 2.24.78 2.94.78.7 0 2.02-.96 3.41-.82.58.02 2.21.23 3.26 1.77-.08.05-1.95 1.14-1.94 3.37M14.16 5.5c.62-.75 1.04-1.8.93-2.85-.9.04-1.98.6-2.63 1.35-.58.66-1.08 1.73-.95 2.75 1 .08 2.03-.51 2.65-1.25"/></svg>`;
const UBUNTU = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2" fill="none" stroke="#e95420" stroke-width="2.6"/><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="0" /><g fill="#e95420"><circle cx="3.6" cy="12" r="2.7"/><circle cx="16.2" cy="4.7" r="2.7"/><circle cx="16.2" cy="19.3" r="2.7"/></g><g fill="#fff"><circle cx="3.6" cy="12" r="4.2" opacity="0"/></g><path d="M6.3 12h3.2M14.4 6.9l1.6-2.8M14.4 17.1l1.6 2.8" stroke="#fff" stroke-width="2.2"/></svg>`;
const WIN = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#f25022"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#7fba00"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#00a4ef"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#ffb900"/></svg>`;

const $ = id => document.getElementById(id);
$('ubIcon').innerHTML = UBUNTU(22);
$('apIcon').innerHTML = APPLE(22, '#111');
$('winIcon').innerHTML = WIN(20);
$('envIcon').innerHTML = UBUNTU(20);

// heading words
const headingEl = $('heading');
HEADING.split(' ').forEach(w => { const s = document.createElement('span'); s.textContent = w; headingEl.appendChild(s); });
const headingWords = [...headingEl.children];

// Fixed layout points (in #world coordinates) used by the pointer
const G = { x: 80, y: 302 };                        // composer group origin
const CARD_Y = G.y + 44 + 36 + 64 + 32;              // card top
const CHIP = { x: G.x + 24 + 48 + 12 + 140 + 12 + 80, y: CARD_Y + 300 - 24 - 28 };
const MENU1_ROW1 = { x: G.x + 100 + 10 + 200, y: CARD_Y + 310 + 10 + 30 };
const MENU2_MAC = { x: G.x + 560 + 10 + 270, y: CARD_Y + 310 + 10 + 48 + 60 + 30 };
const TEXT_POINT = { x: G.x + 520, y: CARD_Y + 150 };
const SEND = { x: G.x + 940 - 24 - 112 + 32, y: CARD_Y + 300 - 24 - 28 };
const POINTER_START = { x: G.x + 470, y: CARD_Y + 440 };

function pointerPos(t) {
  const segs = [
    [T.pointerToChip, POINTER_START, CHIP],
    [T.pointerToEnv, CHIP, MENU1_ROW1],
    [T.pointerToMac, MENU1_ROW1, MENU2_MAC],
    [T.pointerToText, MENU2_MAC, TEXT_POINT],
    [T.pointerToSend, TEXT_POINT, SEND],
  ];
  let pos = POINTER_START;
  for (const [rng, a, b] of segs) {
    if (t >= rng[0]) { const p = prog(t, rng, easeInOut); pos = { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p) }; }
  }
  return pos;
}

function typedText(t) {
  const p = clamp01((t - T.typing[0]) / (T.typing[1] - T.typing[0]));
  return PROMPT.slice(0, Math.round(p * PROMPT.length));
}

function renderCode(t) {
  const total = CODE.reduce((n, l) => n + l.reduce((m, s) => m + s[1].length, 0) + 1, 0);
  const p = clamp01((t - T.codeTyping[0]) / (T.codeTyping[1] - T.codeTyping[0]));
  let budget = Math.floor(easeOut(p) * total);
  let html = '';
  for (const line of CODE) {
    if (budget <= 0) break;
    for (const [cls, txt] of line) {
      if (budget <= 0) break;
      const piece = txt.slice(0, budget); budget -= piece.length;
      html += `<span class="${cls}">${piece.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`;
    }
    html += '\n'; budget -= 1;
  }
  $('code').innerHTML = html;
}

function cropState(t) {
  let cur = { x: CROP[0].x, y: CROP[0].y, z: CROP[0].z };
  for (let i = 1; i < CROP.length; i++) {
    const k = CROP[i];
    if (t < k.t) break;
    const p = prog(t, [k.t, k.t + k.dur], easeOut);
    const prev = { x: CROP[i-1].x, y: CROP[i-1].y, z: CROP[i-1].z };
    // previous target might still be animating; sample prev as fully arrived
    cur = { x: lerp(prev.x, k.x, p), y: lerp(prev.y, k.y, p), z: lerp(prev.z, k.z, p) };
  }
  return cur;
}

function driftScale(t) {
  for (let i = 1; i < DRIFT.length; i++) {
    if (t <= DRIFT[i].t) {
      const p = easeInOut(clamp01((t - DRIFT[i-1].t) / (DRIFT[i].t - DRIFT[i-1].t)));
      return lerp(DRIFT[i-1].s, DRIFT[i].s, p);
    }
  }
  return DRIFT[DRIFT.length - 1].s;
}

const pad4 = n => String(n).padStart(4, '0');
function takeFrame(t) {
  const i = Math.floor((t - TAKE_START) * FPS);
  return Math.max(0, Math.min(TAKE_FRAME_COUNT - 1, i)) + 1;
}

/* ==================================================================== */
/*  seek(t): set every element for composition time t                    */
/* ==================================================================== */
window.seek = async function seek(t) {
  // camera drift
  $('world').style.transform = `scale(${driftScale(t)})`;

  // ---- Opening + Act 1: composer
  const cg = $('composerGroup');
  const outP = prog(t, T.composerOut);
  cg.style.opacity = 1 - outP;
  cg.style.transformOrigin = '50% 100%';
  cg.style.transform = `translateY(${lerp(0, 46, outP)}px) scale(${lerp(1, 0.94, outP)})`;
  cg.style.display = t > T.composerOut[1] + 0.05 ? 'none' : 'block';

  // big lockup slides in, then resolves (moves + shrinks) into the composer header lockup
  const lbIn = prog(t, T.lockupBigIn), rs = prog(t, T.resolve, easeInOut);
  const smallLockup = $('lockupRow').querySelector('img');
  const smallW = 40 * 2984 / 1024;
  const ol = $('openLockup');
  ol.style.opacity = lbIn;
  ol.style.transform = `translateX(${lerp(-70, 0, lbIn)}px)`;
  ol.style.display = rs > 0 ? 'none' : 'block';
  const lx = lerp(OPEN.lockupX - G.x, 0, rs), ly = lerp(OPEN.lockupY - G.y, 0, rs), ls = lerp(OPEN.lockupW / smallW, 1, rs);
  smallLockup.style.transform = `translate(${lx}px, ${ly}px) scale(${ls})`;
  smallLockup.style.opacity = rs <= 0 ? 0 : 1;
  const hx = lerp(OPEN.headingX - G.x, 0, rs), hy = lerp(OPEN.headingY - (G.y + 44 + 36), 0, rs), hs = lerp(OPEN.headingScale, 1, rs);
  headingEl.style.transform = `translate(${hx}px, ${hy}px) scale(${hs})`;

  // card and mode toggle rise in after the header settles
  const cIn = prog(t, T.cardIn);
  const card = $('card');
  card.style.opacity = cIn;
  card.style.transform = `translateY(${lerp(72, 0, cIn)}px) scale(${lerp(0.96, 1, cIn)})`;
  $('modeToggle').style.opacity = cIn;

  headingWords.forEach((w, i) => {
    const a = T.headingStart + i * T.headingStep;
    const pi = prog(t, [a, a + T.headingDur]);
    const n = headingWords.length;
    const b = T.headingOutStart + (n - 1 - i) * T.headingOutStep;
    const po = prog(t, [b, b + T.headingOutDur]);
    w.style.opacity = Math.min(pi, 1 - po);
    w.style.transform = `translateY(${lerp(18, 0, pi) + lerp(0, 14, po)}px)`;
  });

  // prompt text
  const typed = typedText(t);
  const pt = $('promptText');
  if (t < T.typing[0]) {
    pt.className = 'placeholder'; pt.textContent = PLACEHOLDER;
    if (t >= T.pointerToText[1] - 0.05) pt.innerHTML = `<span id="caret"></span>` + PLACEHOLDER;
  } else {
    pt.className = '';
    const caret = (t < T.typing[1] + 0.35 || Math.floor(t * 2) % 2 === 0) ? '<span id="caret"></span>' : '';
    pt.textContent = typed; pt.innerHTML = pt.innerHTML + caret;
  }

  // environment chip + menus
  const macSelected = t >= T.macClick;
  $('envIcon').innerHTML = macSelected ? APPLE(20, '#111') : UBUNTU(20);
  $('envLabel').textContent = macSelected ? 'macOS' : 'Ubuntu';
  $('m1env').textContent = macSelected ? 'macOS' : 'Ubuntu';
  $('envChip').classList.toggle('pressed', (t >= T.chipClick - 0.04 && t < T.menusOut[0]));
  $('chkUbuntu').style.opacity = macSelected ? 0 : 1;
  $('chkMac').style.opacity = macSelected ? 1 : 0;

  const m1 = $('menu1'), m2 = $('menu2');
  const m1in = prog(t, T.menu1In), m2in = prog(t, T.menu2In), mout = prog(t, T.menusOut);
  for (const [el, pin] of [[m1, m1in], [m2, m2in]]) {
    const o = Math.min(pin, 1 - mout);
    el.style.opacity = o;
    el.style.display = o <= 0 ? 'none' : 'block';
    el.style.transform = `translateY(${lerp(-8, 0, pin)}px) scale(${lerp(0.97, 1, pin)})`;
  }
  $('m1r1').classList.toggle('hl', t >= T.pointerToEnv[1] - 0.05 && t < T.menusOut[0]);
  $('m2ubuntu').classList.toggle('hl', t >= T.menu2In[0] && t < T.pointerToMac[1] - 0.12);
  $('m2mac').classList.toggle('hl', t >= T.pointerToMac[1] - 0.12 && t < T.menusOut[0]);

  // send button press
  const sp = t >= T.sendClick && t < T.sendClick + 0.24 ? Math.sin(Math.PI * (t - T.sendClick) / 0.24) : 0;
  $('send').style.transform = `scale(${1 - 0.08 * sp})`;

  // pointer
  const ptr = $('pointer');
  const pin = prog(t, T.pointerIn), pout = prog(t, T.pointerOut);
  const pp = pointerPos(t);
  const clickSq = (c) => (t >= c && t < c + 0.18) ? 1 - 0.12 * Math.sin(Math.PI * (t - c) / 0.18) : 1;
  const ps = clickSq(T.chipClick) * clickSq(T.macClick) * clickSq(T.sendClick);
  ptr.style.opacity = Math.min(pin, 1 - pout);
  ptr.style.left = pp.x + 'px'; ptr.style.top = pp.y + 'px';
  ptr.style.transform = `scale(${ps})`; ptr.style.transformOrigin = '4px 2px';

  // ---- Act 2: control panel
  const panel = $('panel');
  const pIn = prog(t, T.panelIn), pOut = prog(t, T.panelOut);
  const px = lerp(760, 0, pIn) + lerp(0, 760, pOut);
  panel.style.transform = `translateX(${px}px)`;
  panel.style.opacity = Math.min(prog(t, T.panelIn, easeInOut) * 1.6, 1 - prog(t, T.panelOut, easeInOut) * 1.6, 1);
  panel.style.display = (t < T.panelIn[0] || t > T.panelOut[1] + 0.05) ? 'none' : 'block';

  renderCode(t);
  const cl = $('codeLayer');
  const c2c = prog(t, T.codeToCrop, easeInOut);
  cl.style.opacity = 1 - c2c;
  cl.style.display = c2c >= 1 ? 'none' : 'block';

  // crop viewport
  const cs = cropState(t);
  const baseH = PANEL.h, baseW = baseH * TAKE.w / TAKE.h;
  const w = baseW * cs.z, h = baseH * cs.z;
  let left = PANEL.w / 2 - cs.x * w, top = PANEL.h / 2 - cs.y * h;
  // clamp so the crop never shows the panel background when the image is big enough
  if (w >= PANEL.w) left = Math.min(0, Math.max(PANEL.w - w, left)); else left = (PANEL.w - w) / 2;
  if (h >= PANEL.h) top = Math.min(0, Math.max(PANEL.h - h, top)); else top = (PANEL.h - h) / 2;
  const ci = $('cropImg');
  ci.style.width = w + 'px'; ci.style.height = h + 'px';
  ci.style.left = left + 'px'; ci.style.top = top + 'px';

  // take frame (both the anchored phone and the panel crop show the same frame)
  const src = TAKE_FRAMES_DIR + pad4(takeFrame(t)) + '.jpg';
  const imgs = [$('phoneImg'), ci];
  for (const im of imgs) if (im.getAttribute('src') !== src) im.src = src;

  // ---- Act 3: outro
  const lIn = prog(t, T.lockupIn), uIn = prog(t, T.urlIn);
  const lk = $('outroLockup'), url = $('outroUrl');
  lk.style.opacity = lIn; lk.style.transform = `translateX(${lerp(-70, 0, lIn)}px)`;
  url.style.opacity = uIn; url.style.transform = `translateX(${lerp(-36, 0, uIn)}px)`;

  await Promise.all(imgs.map(im => im.decode().catch(() => {})));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
};

// Preview helper: ?t=seconds, or play with ?play
const params = new URLSearchParams(location.search);
if (params.has('play')) {
  const t0 = performance.now();
  (async function loop() { await seek(Math.min(DURATION, (performance.now() - t0) / 1000)); requestAnimationFrame(loop); })();
} else {
  seek(parseFloat(params.get('t') || '0'));
}
</script>
</body>
</html>
