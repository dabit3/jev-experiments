name: Talkie macOS

on:
  pull_request:
    paths:
      - "talkie/**"
      - ".github/workflows/talkie.yml"
  push:
    branches: [main]
    paths:
      - "talkie/**"
      - ".github/workflows/talkie.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    defaults:
      run:
        working-directory: talkie
    steps:
      - uses: actions/checkout@v4
      - name: Lint Swift
        run: swift format lint --strict --recursive Sources Tests Resources/GenerateIcon.swift Package.swift
      - name: Unit tests
        run: swift test
      - name: Build native app
        run: bash run.sh --build-only
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Talkie.app build/Talkie.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Talkie-macOS
          path: talkie/build/Talkie.zip
